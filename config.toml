# badapplebench configuration
# Only the encode stage (full pipeline: arrange + render) is benchmarked.
# This measures the total time to compute the output video.

[bench]
warmup = 1
runs = 10
test_pages = 2000
test_frames = 200
test_video = "badapple.mp4"

[bench.render]
width = 7680
height = 4320

# ── C v1.0.0 (unified binary) ──

[[impl]]
lang = "c"
label = "v1.0.0"
git_url = "https://github.com/TheFirstIstari/BadApplestein.git"
git_ref = "v1.0.0"
repo_dir = "BadApplestein"
build_cmd = "make -j"
binary_path = "src/badapplestein"

[[impl.bench_cmds]]
stage = "encode"
cmd = "{binary} encode {video} {output} --library {lib} --max-frames {frames} --no-hw --quiet"

# ── Odin dev ──
# NOTE: Odin binary has a pre-existing FFmpeg offset compatibility issue at runtime.
# CLI parsing was fixed (cli.odin) but FFmpeg pointer arithmetic offsets need
# recalibration for the installed FFmpeg build. See BADODINSTEIN_AUDIT.md.

[[impl]]
lang = "odin"
label = "dev"
git_url = "https://github.com/TheFirstIstari/BadOdinStein.git"
git_ref = "master"
repo_dir = "BadOdinStein"
build_cmd = "mise run build"
binary_path = "badodin"

[[impl.bench_cmds]]
stage = "encode"
cmd = "{binary} arrange --video {video} --features {lib}/features.bin --registry {lib}/registry.bin --max-frames {frames} && {binary} render --manifests manifests_greedy --registry {lib}/registry.bin --output {output}.mov --width {width} --height {height} --max-frames {frames}"

# ── Zig dev (BadZiggle) ──

[[impl]]
lang = "zig"
label = "dev"
git_url = "https://github.com/TheFirstIstari/BadZiggle.git"
git_ref = "master"
repo_dir = "BadZiggle"
build_cmd = "zig build"
binary_path = "zig-out/bin/badziggle"

[[impl.bench_cmds]]
stage = "encode"
cmd = "{binary} arrange --video {video} --features {lib}/features.bin --registry {lib}/registry.bin --manifests {output} --max-frames {frames} --quiet && {binary} render --manifests {output} --registry {lib}/registry.bin --output {output}/output.mov --width {width} --height {height} --max-frames {frames}"
