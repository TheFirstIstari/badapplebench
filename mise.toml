# badapplebench — mise task runner
# Run: mise run bench (full benchmark suite)

[tools]
java = "latest"
python = "3.12"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.bench]
description = "Run full benchmark suite (setup + build + benchmark all impls, all stages)"
run = "bash scripts/run_all.sh"

[tasks.arrange]
description = "Benchmark arrange stage only for all impls that support it"
run = "bash scripts/run_all.sh arrange"

[tasks.render]
description = "Benchmark render stage only for all impls that support it"
run = "bash scripts/run_all.sh render"

[tasks.clean]
description = "Remove generated artifacts (test_lib, repos) and re-link local dev checkouts"
run = "bash scripts/clean.sh"
